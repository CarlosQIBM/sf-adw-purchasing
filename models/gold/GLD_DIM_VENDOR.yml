version: 2

models:
  - name: GLD_DIM_VENDOR
    description: >
      Gold-layer vendor dimension table. One row per vendor (one row = one company we buy from).
      Built from SLV_PURCHASING_VENDOR_STANDARDIZED silver layer. Includes a surrogate key,
      decoded credit rating descriptions, and standardized column naming for analytics use.
    columns:
      - name: vendor_id
        description: "Surrogate key for the vendor dimension; generated from business_entity_id."
        data_tests:
          - unique
          - not_null

      - name: business_entity_id
        description: "Business key. Unique identifier of the vendor; foreign key to the business entity (source: business_entity_id)."
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('adw_core', 'brz_adventure_works_person__business_entity')
                field: business_entity_id

      - name: vendor_account_number
        description: "Vendor account number used to identify the vendor (e.g., 'AUSTRALI0001')."

      - name: vendor_name
        description: "Company name of the vendor."
        data_tests:
          - not_null

      - name: vendor_credit_rating
        description: "Ordinal credit rating ranking where 1 = Superior (best) and 5 = Below average (worst). Ordinal, not a measure: do not naively average or sum it."
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]

      - name: vendor_credit_rating_description
        description: "Human-readable description of the credit rating (Superior, Excellent, Good, Average, Below Average)."
        data_tests:
          - accepted_values:
              arguments:
                values: ['Superior', 'Excellent', 'Good', 'Average', 'Below Average', 'Unknown']

      - name: vendor_is_preferred
        description: "True if the vendor is preferred over other vendors supplying the same product."

      - name: vendor_is_active
        description: "True if the vendor is currently in use, false if no longer used."

      - name: vendor_purchasing_web_service_url
        description: "Vendor's purchasing web service URL."
