version: 2

models:
  - name: SLV_PURCHASING_SHIP_METHOD_STANDARDIZED
    description: >
      Silver-layer ship method. One row per shipping method, built from
      adw_core's brz_adventure_works_purchasing__ship_method. Drops rowguid
      and modified_date and renames columns to business conventions.
      Feeds GLD_DIM_SHIP_METHOD.
    columns:
      - name: ship_method_id
        description: "Primary key. Unique identifier of the shipping method (source: ship_method_id)."
        data_tests:
          - unique
          - not_null

      - name: ship_method_name
        description: "Name of the shipping method, e.g. 'XRQ - TRUCK GROUND' (source: name)."
        data_tests:
          - not_null

      - name: ship_method_minimum_charge_dollars
        description: "Flat base charge applied to every shipment, in dollars (source: ship_base)."

      - name: ship_method_rate_per_pound_dollars
        description: "Variable shipping rate charged per pound of shipment weight, in dollars (source: ship_rate)."
